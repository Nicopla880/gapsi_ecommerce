# Íconos de la app. Regenerar con:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"

  android: true
  ios: true

  # Ícono adaptativo de Android. El foreground usa una versión con padding:
  # Android recorta el foreground a la "safe zone" (~66% central del canvas),
  # así que el logo a sangre se cortaría por los bordes.
  adaptive_icon_background: "#0B1E4D"
  adaptive_icon_foreground: "assets/branding/app_icon_adaptive_fg.png"

  # iOS no admite canal alfa en el ícono: se aplana sobre el azul de marca.
  remove_alpha_ios: true
  background_color_ios: "#0B1E4D"
